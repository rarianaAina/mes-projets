<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mes projets</title>
<meta name="description" content="Les applications web que je développe et déploie.">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧰</text></svg>">
<style>
  :root {
    --bg: #fbfbfd;
    --surface: #ffffff;
    --fg: #18181b;
    --muted: #71717a;
    --line: #e4e4e7;
    --accent: #6366f1;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0b0f;
      --surface: #16161c;
      --fg: #f4f4f5;
      --muted: #a1a1aa;
      --line: #27272e;
      --accent: #818cf8;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 0 16px;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
  }

  .wrap { max-width: 540px; margin: 0 auto; }

  h1 {
    margin: 0;
    padding: 72px 0 28px;
    font-size: clamp(1.6rem, 5vw, 2rem);
    letter-spacing: -0.02em;
  }

  ul { list-style: none; margin: 0; padding: 0 0 64px; }
  li + li { margin-top: 8px; }

  a {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--surface);
    text-decoration: none;
    color: inherit;
    transition: border-color .15s;
  }
  a:hover, a:focus-visible { border-color: var(--accent); }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  .icon { font-size: 1.25rem; line-height: 1; }
  .text { min-width: 0; flex: 1; }
  .name { display: block; font-weight: 600; font-size: .95rem; }
  .note { display: block; color: var(--muted); font-size: .82rem; }

  .arrow { color: var(--muted); transition: transform .15s, color .15s; }
  a:hover .arrow, a:focus-visible .arrow { color: var(--accent); transform: translateX(3px); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Mes projets</h1>
  <ul id="liste"></ul>
</div>

<script>
  // Pour ajouter un projet : une entrée de plus dans ce tableau.
  const projets = [
    { icone: "📚", nom: "Révisions — QCM",        note: "QCM générés depuis un cours PDF",      url: "https://revisions-qcm.vercel.app/" },
    { icone: "📄", nom: "Fusion de PDF",          note: "Réunir plusieurs PDF et photos",       url: "https://pdf-merger-red.vercel.app/" },
    { icone: "🗓️", nom: "Mon planning A/B",       note: "Emploi du temps en semaines alternées", url: "https://planning-seven-nu.vercel.app/" },
    { icone: "💬", nom: "Humeur",                 note: "Humeur et disponibilité, à deux",      url: "https://humeur-nu.vercel.app/" },
    { icone: "📊", nom: "Comparateur Instagram",  note: "Abonnés et abonnements comparés",      url: "https://instagram-comparator.vercel.app/" },
  ];

  document.getElementById("liste").innerHTML = projets
    .map(
      (p) => `
      <li>
        <a href="${p.url}" target="_blank" rel="noopener noreferrer">
          <span class="icon" aria-hidden="true">${p.icone}</span>
          <span class="text">
            <span class="name">${p.nom}</span>
            <span class="note">${p.note}</span>
          </span>
          <span class="arrow" aria-hidden="true">→</span>
        </a>
      </li>`
    )
    .join("");
</script>
</body>
</html>
